related_formalizations: []

status:
  scope: >-
    Formalized in full: sigma_1(R^2) <= 6934/10000, stated as
    Besicovitch.sigma_one_plane_le_6934_div_10000 over
    EuclideanSpace R (Fin 2), with sigma_1 defined inside Challenge.lean as the
    infimum of the thresholds that force countable 1-rectifiability. The proof
    term is complete and uses only propext, Classical.choice and Quot.sound.
    The supporting chain is formalized too: the geometric measure theory layer,
    the Besicovitch pair condition, the six-point transfer, the packing failure
    tree, the thirty Gram certificates and the radius cover.

    Deliberately not formalized, and the reason. The sharp constant of the
    two-colour six-centre problem is an algebraic number
    theta_6 = 0.693306421825904872690678414403710951..., and the bound proved
    here exceeds it by about 9.36e-5. The obstruction is not mathematical but
    certificate-theoretic: at theta_6 the extremal configuration is attained,
    three structurally different packing mechanisms tie simultaneously, and the
    weighted score is exactly zero at an interior point with vanishing gradient,
    so no strict certificate of the shape used here exists there. Moving the
    chord to the rational value 3467/2500 breaks every tie and raises the
    available margin from about 1e-8 to about 5.8e-4, which is what makes a
    fixed family of thirty certificates sufficient. The constant is also bounded
    above: the routing separators that prune the case tree fail once the chord
    exceeds about 1.386850, so the admissible window is narrow and 6934/10000
    sits inside it.

    Also not formalized: Besicovitch's conjecture itself, which remains open;
    no claim is made about it. The six-point method cannot reach below theta_6
    however it is certified, so this development does not approach 1/2.

    A companion theorem, Besicovitch.sStar_le_6934_div_10000, records that the
    exact six-point endpoint lies below the rational target. It is not the
    submitted Comparator declaration.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["OpenAI ChatGPT project sessions; exact model versions not recorded locally"]
      framework: "ChatGPT project workspace with local file mirror"
      tool_setup: >-
        The mathematics was developed in a ChatGPT project before any Lean was
        written: the six-point analysis, the sharp constant, the packing failure
        tree, and finally the Gram-certificate argument and its thirty exact
        rational certificates. Output comprised 246 markdown research notes
        (about 618,000 words), 86 C++ search programs, 16 LaTeX write-ups and 53
        Python verifiers. The certificate family was checked three ways before
        formalization: an exact rational verifier, an independent symbolic
        reconstruction in SymPy, and a diagnostic sweep of 3000 random feasible
        configurations.
      cost:
        wall_time: "research output spans 2026-08-26 to 2026-08-31 (6 days); session wall time not recorded"
        spend_usd: "subscription-based"
        hardware: "API-only"
      prompting_notes: >-
        Human-directed exploration of the six-point optimization problem;
        transcripts are not retained locally, so no representative prompts can
        be quoted.
    - method: "agent"
      models: ["claude-opus-5", "claude-fable-5-1"]
      framework: "Claude Code"
      tool_setup: >-
        The Lean 4 development was written by an agent in Claude Code against
        Mathlib, with the human directing scope, supplying the Gram-certificate
        document, and deciding to abandon the earlier route. Measured from the
        session transcripts: 3,326 API calls, 2,462,393 output tokens, and
        47,951,563 tokens of input plus output plus cache writes, over 19 h 58 m
        of wall clock. The work splits at the point the Gram-certificate
        document arrived: an earlier attempt to certify the sharp constant
        through six-variable Bernstein certificates consumed 94 percent of those
        tokens and 75 percent of the wall clock and left no surviving line, and
        the delivered proof cost about 2.7 million tokens over 5 hours. The
        repository folder effort/ documents this and ships a script that
        regenerates the figures.
      cost:
        wall_time: "19 h 58 m of agent session wall clock"
        spend_usd: "subscription-based"
        hardware: "local machine for Lean builds, API-only for inference"
      prompting_notes: >-
        Goal-directed with periodic human review. The decisive human
        interventions were rejecting the sharp-constant target as infeasible,
        supplying the Gram-certificate document, and requiring that certificate
        data be rechecked inside Lean rather than trusted.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Human direction, mathematical judgement and review throughout: choice of
        target constant, acceptance of the weaker rational bound, and final
        reading of the statement and its definitions.
      cost:
        wall_time: "not tracked separately from the sessions above"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based; not separately tracked"
  notes: >-
    Two stages with a clean handover. The mathematics was produced first in a
    ChatGPT project and delivered as a written argument together with thirty
    exact rational certificates and two independent verifiers. The Lean
    formalization was then produced by an agent in Claude Code. Before any
    formalization the certificate data was re-derived from the definitions in
    exact rational arithmetic by a third independent transcription, which
    reproduced all thirty published upper bounds exactly; that agreement also
    guards the transcription into Lean, since one mistyped integer changes the
    computed bound. All figures above are measured from machine records, not
    estimated; the folder effort/ states which quantities could not be recovered
    rather than guessing them.

fidelity:
  divergences: >-
    None from a cited source, since no source result is being formalized: the
    background references supply framework and history only, and the bound
    proved here is stated for the first time by this project.

    Two qualifications a reader should carry. First, the theorem is weaker than
    the optimum of the finite problem it solves, by about 9.36e-5; the reason is
    recorded under scope. Second, the thirty certificates were discovered by an
    unverified numerical search. That search is not part of the proof: Lean
    recomputes each certificate's exact rational upper bound from the stored
    integers and rechecks every sign condition, and the positive semidefiniteness
    on which the argument rests is proved identically from a rank-one
    decomposition, with no eigenvalue computation or numerical test anywhere.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    No external mathematical review. Checks performed by the authors. The
    statement was audited by computing the transitive definition closure of the
    submitted theorem and confirming it is identical between Challenge.lean and
    Solution.lean: five constants, sigmaOne, ForcesOneRectifiability,
    lowerOneDensity, IsCountablyOneRectifiable and one proof term. Axioms of the
    submitted declaration were printed and are exactly propext,
    Classical.choice and Quot.sound. The repository contains no native_decide,
    no Lean.ofReduceBool, no admit and no axiom declaration. The certificate
    data was verified three times independently before formalization, as
    described under automation. The Comparator itself has not been run by the
    authors; only the conditions it checks have been reproduced by hand.

alignment:
  namespace: "Besicovitch"
  statements:
    - source: >-
        Original result: the planar one-dimensional rectifiability threshold
        satisfies sigma_1(R^2) <= 6934/10000
      lean: "Besicovitch.sigma_one_plane_le_6934_div_10000"
      module: "Solution"
      status: "proved"
      note: >-
        The submitted Comparator declaration, matching the hole in
        Challenge.lean. Complete proof term, no sorry, axioms limited to
        propext, Classical.choice and Quot.sound.
    - source: >-
        Supporting bound: the exact six-point endpoint lies below the rational
        target
      lean: "Besicovitch.sStar_le_6934_div_10000"
      module: "Solution"
      status: "proved"
      note: >-
        Not part of the Comparator submission. Recorded because it shows the
        formalized rational constant is consistent with, and close to, the sharp
        constant of the finite problem.
    - source: >-
        Analytic endpoint: the weighted score is at most -1/2000 for every
        separated pair of sibling pairs in the unit ball
      lean: "Besicovitch.weightedGeometricBound_gram"
      module: "Besicovitch.SixPoint.GramWeightedBound"
      status: "proved"
      note: >-
        The mathematical content that the thirty Gram certificates supply, and
        the only new analytic input to the six-point argument.

acknowledgements: >-
  Built on Lean 4 and Mathlib. The structural approach, reducing the density
  hypothesis to a finite family of optimization problems, is due to De Lellis,
  Glaudo, Massaccesi and Vittone. The Lean formalization was carried out with
  Claude Code; the underlying mathematics was developed with ChatGPT. Neither
  system is listed as an author, in line with Palomar's human-authorship
  requirement; their roles are recorded in the automation section above.
