status:
  scope: |-
    Formalized in full: sigma_1(R^2) <= 6934/10000, stated as Besicovitch.sigma_one_plane_le_6934_div_10000 over EuclideanSpace R (Fin 2), with sigma_1 defined inside Challenge.lean as the infimum of the thresholds that force countable 1-rectifiability. The proof term is complete and uses only propext, Classical.choice and Quot.sound. The supporting chain is formalized too: the geometric measure theory layer, the Besicovitch pair condition, the six-point transfer, the packing failure tree, the thirty Gram certificates and the radius cover.
    Deliberately not formalized, and the reason. The sharp constant of the two-colour six-centre problem is an algebraic number theta_6 = 0.693306421825904872690678414403710951..., and the bound proved here exceeds it by about 9.36e-5. The obstruction is not mathematical but certificate-theoretic: at theta_6 the extremal configuration is attained, three structurally different packing mechanisms tie simultaneously, and the weighted score is exactly zero at an interior point with vanishing gradient, so no strict certificate of the shape used here exists there. Moving the chord to the rational value 3467/2500 breaks every tie and raises the available margin from about 1e-8 to about 5.8e-4, which is what makes a fixed family of thirty certificates sufficient. The constant is also bounded above: the routing separators that prune the case tree fail once the chord exceeds about 1.386850, so the admissible window is narrow and 6934/10000 sits inside it.
    Formalized in full as a compared theorem: the lower bound 1/2 <= sigma_1(R^2), Besicovitch.one_half_le_sigma_one_plane, by exhibiting Besicovitch's purely unrectifiable graph with lower density at least 1/2 at every interior point. Mathlib contains no notion of rectifiability and no purely unrectifiable set, so the example and all three of its properties are constructed here from scratch (Besicovitch/Example/). What is not proved about the example: the matching upper density bound 1/2 (Capdevila's part D) and the sharp equality of the graph's Hausdorff measure with its base measure; neither is needed for the bound, and the crude constant 2 is used instead.
    Also not formalized: Besicovitch's conjecture itself, which remains open; no claim is made about it. The six-point method cannot reach below theta_6 however it is certified, so this development does not approach 1/2.
    A companion theorem, Besicovitch.sStar_le_6934_div_10000, records that the exact six-point endpoint lies below the rational target. It is not the submitted Comparator declaration.
