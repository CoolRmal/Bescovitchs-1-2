  notes: |-
    Two stages with a clean handover. The mathematics was produced first in a ChatGPT project and delivered as a written argument together with thirty exact rational certificates and two independent verifiers. The Lean formalization was then produced by an agent in Claude Code. Before any formalization the certificate data was re-derived from the definitions in exact rational arithmetic by a third independent transcription, which reproduced all thirty published upper bounds exactly; that agreement also guards the transcription into Lean, since one mistyped integer changes the computed bound. All figures above are measured from machine records, not estimated; the folder effort/ states which quantities could not be recovered rather than guessing them.
fidelity:
  divergences: |-
    None from a cited source, since no source result is being formalized: the background references supply framework and history only, and the bound proved here is stated for the first time by this project.
    Two qualifications a reader should carry, besides the standing one that sigma_1 is an infimum whose attainment is not claimed. First, the theorem is weaker than the optimum of the finite problem it solves, by about 9.36e-5; the reason is recorded under scope. Second, the thirty certificates were discovered by an unverified numerical search. That search is not part of the proof: Lean recomputes each certificate's exact rational upper bound from the stored integers and rechecks every sign condition, and the positive semidefiniteness on which the argument rests is proved identically from a rank-one decomposition, with no eigenvalue computation or numerical test anywhere.
review:
  status: self-assessed
  reviewers:
