sources:
- title: |-
    The bound sigma_1(R^2) <= 6934/10000 for Besicovitch's 1/2-problem, via thirty rational Gram certificates for the two-colour six-centre problem
  type: original-proof
  relationship: other
  note: |-
    Novelty qualification. The claim that sigma_1(R^2) <= 6934/10000 is new rests on the literature search recorded under review.notes, performed on 2026-09-02 in five passes (forward citations, arXiv, bibliographic databases and encyclopedias, author and talk pages, and an adversarial verification pass that read the published Trans. AMS text of De Lellis-Glaudo-Massaccesi-Vittone, Schechter's 2002 thesis, Farag's papers, Bate's Acta paper, Azzam-Hyde and Capdevila's July 2026 preprint in full). That search found no upper bound below 7/10 in any paper, preprint, thesis, talk abstract, encyclopedia entry or code repository it could reach; every citing work of the 7/10 paper (three in Google Scholar, none in Semantic Scholar, OpenAlex or Crossref, one more found by full text) restates 7/10 as the best known bound or cites it without a number, and the only sub-0.7 numbers in print are that paper's own 0.683 and 0.64368..., which its authors do not claim as bounds. It also found no occurrence of 0.6934 or 6934/10000 in connection with the problem, in the texts read, in the authors' companion code, in Google Scholar, arXiv abstracts, general web search or public GitHub code. The verifier put the confidence at about 95 percent for 7/10 being the published record and about 97 percent for 0.6934 being unpublished. Sources not reached were MathSciNet full search, Web of Science, NASA ADS, the Semantic Scholar search endpoint and Schechter's 1998 Diplomarbeit (whose bound, 0.72655..., is known from his 2002 thesis and from the published 7/10 paper, which credits it as the previous record). Novelty and priority are asserted on this basis alone and could be overturned by unindexed, forthcoming or paywalled work.
