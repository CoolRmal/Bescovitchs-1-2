# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A machine-checked bound of 0.6934 for Besicovitch's 1/2-problem"
  description: >-
    Besicovitch's 1/2-conjecture asserts that a Borel set in the plane with
    finite one-dimensional Hausdorff measure whose lower density exceeds 1/2
    almost everywhere is countably 1-rectifiable. Writing sigma_1(R^2) for the
    least threshold that forces countable 1-rectifiability, the conjecture is
    sigma_1(R^2) = 1/2. The previously published record is sigma_1(R^2) <= 7/10,
    obtained by De Lellis, Glaudo, Massaccesi and Vittone.

    This development proves, with a complete Lean 4 proof term,
    sigma_1(R^2) <= 6934/10000 = 0.6934.
  authors:
    - "Yongxi Lin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yongxi Lin"

classification:
  arxiv: ["math.CA", "math.MG"]
  msc2020: ["28A75", "28A78", "49Q15", "68V20", "90C05"]

sources:
