    Sources examined and what each claims.
    - De Lellis, Glaudo, Massaccesi, Vittone, Besicovitch's 1/2 problem and linear programming. arXiv:2404.17536 (v1 26 Apr 2024, v2 23 May 2024); Trans. Amer. Math. Soc. 379 (2026), no. 7, 5051-5098, DOI 10.1090/tran/9609, published electronically 18 Feb 2026; zbMATH 8209863; MR5079942; OpenAlex W4396244041 (arXiv) and W7130464003 (journal). Four copies were read in full text: arXiv v2, the IAS copy, the cvgmt copy (page updated 12 Apr 2026) and the published journal PDF. Proves sigma-bar <= 0.7 (Theorem 1.3; Definition 1.2 is the same normalisation as this project's sigma_1(R^2)), and sigma-bar(X,d) <= sigma_PT = 0.72655... for general metric spaces (Theorem 3.3, retitled 'Schechter (Preiss-Tiser on steroids)' in the journal version). Also contains, and explicitly does not claim as bounds, 2-OneMinM_0.683 = 0 (a limit of the second-generation method, Theorem 3.4) and OneMinM_0.64368... = 0 with 'If this conjecture were true, it would imply sigma-bar <= 0.64368...' and 'some weak experimental evidence that this may be the sharp bound' (Theorem 3.5 and discussion). No k >= 3 constant is computed. The published abstract credits the previous best bound to Schechter rather than to Preiss-Tiser. The strings 0.6934, 6934 and 0.69 do not occur in any copy; Appendix A and the companion code proof_07.cpp fix 'const double sigma = 0.7;'.
    - Companion software of DLGMV: github.com/dario2994/besicovitch-half-conjecture (single commit 24 Jul 2025; LICENSE and proof_07.cpp; OR-Tools LP solver; sigma = 0.7 only); Padua Research Archive records 11577/3604214 (published version, WOS:001694935500001) and 11577/3578478 (software, 2025). No other value of sigma.
    - Preiss and Tiser, On Besicovitch's 1/2-problem, J. London Math. Soc. (2) 45 (1992) 279-287; zbMATH 120128; OpenAlex W2080237992. Proves sigma_1(M) <= (2+sqrt46)/12 = 0.73186... for every metric space M. Google Scholar 'Cited by 61' (6 since 2024, none with a bound below 0.7); OpenAlex cited_by_count 6 (0 since 2024).
    - Schechter, Eine Verbesserung der oberen Schranke im Besicovitch 1/2-Problem, Diplomarbeit, Universitaet Kaiserslautern, 1998 (unpublished; not online; cited as [Sch98] by DLGMV), and Regularity and Other Properties of Hausdorff Measures, PhD thesis, University College London, January 2002, supervisor David Preiss (UCL Discovery 10102053; ProQuest U643853; PDF read in full). The thesis restates the Diplomarbeit bound sigma_1(M) < .7266 for every metric space M (its progress table ends '1998 A. Schechter in [35] sigma_1(M) < .7266'; DLGMV identify this number with sigma_PT) and constructs a purely 2-unrectifiable translation-invariant metric on the real line with lower 2-density strictly greater than 1/2, showing the generalised metric-space conjecture is false. Neither is an upper bound below 0.7 on the planar threshold.
    - Farag, Some affirmative results towards the Besicovitch 1/2-conjecture, PhD thesis, Yale, 1997 (MR2695866); Unrectifiable 1-sets with moderate essential flatness satisfy Besicovitch's 1/2-conjecture, Adv. Math. 149 (2000) 89-129, DOI 10.1006/aima.1999.1859 (MR1742355; zbMATH 1422991); On the 1/2-problem of Besicovitch: quasi-arcs do not contain sharp saw-teeth, Rev. Mat. Iberoam. 18 (2002) 17-40, DOI 10.4171/rmi/310 (zbMATH 1803982). Proves the value 1/2 only for totally unrectifiable 1-sets satisfying a measure-theoretic flatness condition at almost every point and small scales; conditional, and classified as such by DLGMV ('provided that the set E satisfies some additional condition'). OpenAlex lists one citing work since 2024: DLGMV.
    - Bate, Purely unrectifiable metric spaces and perturbations of Lipschitz functions, Acta Math. 224 (2020) 1-65, arXiv:1712.07139 (zbMATH 7194389; OpenAlex W2777147084). Hypothesis 'positive lower density' only; a residuality statement replacing the Besicovitch-Federer projection theorem in metric spaces; no numerical threshold. Its 8 citing works since 2024 in OpenAlex are unrelated to the threshold.
    - Azzam and Hyde, The weak lower density condition and uniform rectifiability, Ann. Fenn. Math. 47 (2022) 791-819, arXiv:2005.02030. A uniform-rectifiability criterion for Ahlfors regular sets under a Carleson condition, with Hausdorff-content normalisation; no bound on sigma-bar.
    - Capdevila, Besicovitch's example in higher dimensions: a purely unrectifiable set with large lower density, arXiv:2607.05206, submitted 6 Jul 2026, math.CA (zbMATH 903096499; OpenAlex W7167747825). Proves the lower bound sigma_{d,n} >= 1/2 for all 0 < d < n; states 'Recently, in 2024, Camillo De Lellis et al. [dLGMV24] established that sigma_{1,n} <= 7/10, which is currently the best known upper bound.' Its only post-2024 reference is DLGMV.
    - Capdevila Jove (supervisor Tolsa), Densities for Hausdorff measure and rectifiability. Besicovitch's 1/2-conjecture: UB Advanced Mathematics master's thesis, 13 Jun 2025 (diposit.ub.edu), and extended abstract in Reports@SCM 10 (2025) 75-92 (IEC repository PDF; the raco.cat copy returned 403). Both state that 7/10 is 'currently the best known upper bound' and extend Besicovitch's example to sigma_m(R^n) >= 1/2. No new upper bound.
    - Bate and Valentine, Characterising 1-rectifiable metric spaces via connected tangent spaces, arXiv:2503.15159 (v1 19 Mar 2025, v2 19 Jan 2026); Int. Math. Res. Not. IMRN 2026, no. 4, rnag014, DOI 10.1093/imrn/rnag014, published 10 Feb 2026 (zbMATH 8159682). Qualitative rectifiability criterion; cites DLGMV once ('These results, and the progress towards the conjecture, were recently extended further by De Lellis, Glaudo, Massaccesi and Vittone') without any number.
    - Bate, On 1-regular and 1-uniform metric measure spaces, arXiv:2501.05920 (10 Jan 2025). Cites DLGMV as background ('A related question is the Besicovitch 1/2 conjecture'); no bound. Found by full-text check; not in Google Scholar's cited-by list for DLGMV.
    - Other 2024-2026 papers surfaced by the sweeps and checked as making no claim about the threshold: Del Nin-Merlo arXiv:2508.15400; Krandel arXiv:2403.14479 (IMRN 2025); Jaye-Wang arXiv:2606.24461; Li-Taylor arXiv:2606.00381; Idu arXiv:2509.07212; Tasso arXiv:2511.12636; Altaf arXiv:2412.11190; Dabrowski arXiv:2408.03919; Litvinov arXiv:2501.02606; Gruner-Reimann arXiv:2602.00940; Bate-Weigt arXiv:2501.02948; Bongers-Bright-Marshall-Taylor arXiv:2608.10253; Le arXiv:2608.30166; Tolsa arXiv:2607.16457; arXiv:2510.13525; Mattila's survey arXiv:2112.00540 (last revised 2022, before DLGMV); Rigot arXiv:1004.1369 (2010, Carnot groups). Balogh-Rickly-Serra Cassano, Publ. Mat. 47 (2003) 237-259, and Keith (2003) were not read in full; both predate DLGMV by two decades and are not cited for any planar bound by Preiss-Tiser's successors, Schechter's 2002 progress table, or DLGMV, and were classified as irrelevant on that basis.
    - Talk abstracts: Glaudo, EPFL, 15 Mar 2024 (1/2, 3/4, about 0.732; 'further improvements'); De Lellis, GSSI colloquium, 29 Jul 2024 ('Our sharpest result is that Besicovitch's conjecture is correct if we replace 1/2 with 7/10'; recording on YouTube); De Lellis, Caltech, 15 Jan 2025; De Lellis, Bocconi, 26 Feb 2025 (the 22 Apr 2024 date was cancelled; 3/4, about 0.735, 'a substantially lower number'); De Lellis, ETH FIM 60 years, 11-13 Jun 2025 (3/4, about 0.735, 0.7). GMT Trento 2026 (23 talks) and the Westlake winter school of 1-6 Feb 2026 (projection theorems) announce nothing on the problem. None gives a number below 0.7.
    - Pansu, On Besicovitch's 1/2-problem [after Preiss and Tiser], seminar slides, 5 Nov 2020: 3/4 and (2+sqrt46)/12 only; predates DLGMV.
    - Encyclopedias: Wikipedia (Rectifiable set; Abram Samoilovitch Besicovitch; Geometric measure theory; List of unsolved problems in mathematics; David Preiss) and Encyclopedia of Mathematics (Rectifiable set; Density of a set; Hausdorff measure; Geometric measure theory). Either omit the problem or stop at Besicovitch's 3/4 and the Preiss-Tiser improvement; none mentions 7/10 or anything lower.
    - Code and formalisation corpora: public GitHub code (gh search code), the GitHub repository search API, google-deepmind/formal-conjectures (no Besicovitch entry; calibrated), openai/ten-proofs (no Besicovitch entry), Zenodo. No Lean formalisation of the problem and no code stating a bound other than 0.7.

    Citation counts for DLGMV on 2026-09-02: Google Scholar 3 (Bate-Valentine; Capdevila; Capdevila Jove-Tolsa); Semantic Scholar 0 (arXiv-id citations endpoint, and the journal-DOI record); OpenAlex 0 for both W4396244041 and W7130464003; Crossref is-referenced-by-count 0 for 10.1090/tran/9609; zbMATH no citing document indexed (rf: and ci: queries return the empty-set 404; the reference index also omits DLGMV among the citers of Preiss-Tiser, so it is incomplete); INSPIRE no record. Full-text checks added one citer missed by Google Scholar (Bate arXiv:2501.05920).

    Sources not reached, stated plainly: MathSciNet full search and Web of Science (subscription; the free MR Lookup was used, which returns only the three most recent matches per query); NASA ADS (TLS error); zbMATH web interface (HTTP 403 or Cloudflare; the REST API was used); Semantic Scholar paper search endpoint (HTTP 429 on every attempt); BASE (JavaScript-only); the AMS article landing pages (HTTP 403; the journal PDF and print-matter PDF were reached by curl); Reports@SCM on raco.cat (403; the IEC copy was read); the UCL and CORE record pages (403; the thesis PDF was reached); ScienceDirect (403; Farag 2000's abstract not retrieved, its title and DLGMV's characterisation establish it is conditional); the Cantor's Paradise blog post (domain redirected or 403); MathOverflow (blocked for direct fetch; web search found no thread); the Caltech calendar and, via WebFetch, the GSSI and Westlake pages (certificate errors; the latter two were reached by curl); the YouTube page (footer only); Schechter's 1998 Diplomarbeit itself (not online; its bound is known from the 2002 thesis and from DLGMV).

    Conclusion.
    (a) 7/10 is the published record. As of 2026-09-02 no published paper, preprint, thesis, talk abstract, encyclopedia entry or public code repository found by any of the five passes states an upper bound below 7/10 for sigma_1(R^2). Every work that cites DLGMV either restates 7/10 as 'currently the best known upper bound' or cites it without a number; the most recent independent statement in the literature (Capdevila, 6 Jul 2026) says exactly that. The only numbers below 0.7 that occur anywhere are DLGMV's own 0.683 and 0.64368... (a method limit and an explicitly conditional remark, neither claimed as a theorem), Farag's 1/2 under a flatness hypothesis, and Schechter's metric-space lower bound; none is an unconditional upper bound on the planar threshold. The verification pass assigned this conclusion a confidence of about 95 percent. The residual risk is a preprint of the last few weeks not yet indexed, a thesis outside the indexed repositories, or material behind the MathSciNet and Web of Science subscription walls.
    One correction to the historical record that the search produced: the published version of DLGMV credits the previous best bound to Schechter, not to Preiss-Tiser. The chronology of unconditional upper bounds is therefore 3/4 (Besicovitch), (2+sqrt46)/12 = 0.73186... (Preiss-Tiser, 1992), 0.72655... (Schechter, 1998, unpublished Diplomarbeit; restated in his 2002 UCL thesis; reproved as DLGMV Theorem 3.3, valid in any metric space), 7/10 (DLGMV, arXiv 2024, Trans. AMS 2026), and the 0.6934 of this project. The README table should carry the Schechter line.
    (b) 0.6934 is unpublished. The strings 0.6934, 6934/10000, 0.69330, 0.693 and 6934 do not occur in any source examined: not in the four full texts of DLGMV, the companion code, Schechter's thesis, Capdevila's paper, the UB thesis, the Reports@SCM abstract or the Pansu slides; Google Scholar, arXiv abstract search, general web search in several languages and public GitHub code return no mathematical hit. The verification pass assigned this conclusion a confidence of about 97 percent; the residual risk is confined to sources that cannot be full-text searched (MathSciNet reviews, the 1998 Diplomarbeit).
    Both conclusions are negative findings from the sources reachable on one day. They could be overturned by work that is unindexed, forthcoming, or paywalled, and the project asserts novelty and priority only on that basis.

    The Comparator's first automated review, 2026-09-02, reported mechanical verification succeeded and asked for the admissible set to be shown nonempty and for the novelty claim to be supported. Both are addressed: genuine admissible thresholds are compared (every threshold strictly above the constant), the lower bound 1/2 is compared as well so the value is pinned to [1/2, 6934/10000], sigmaOne is described as an infimum whose attainment is not claimed, and the literature search above supports the record claim with the novelty claim qualified accordingly.
alignment:
  namespace: Besicovitch
  statements:
  - source: |-
      Original result: the planar one-dimensional rectifiability threshold satisfies sigma_1(R^2) <= 6934/10000
    lean: Besicovitch.sigma_one_plane_le_6934_div_10000
    module: Solution
    status: proved
    note: |-
      The submitted Comparator declaration, matching the hole in Challenge.lean. Complete proof term, no sorry, axioms limited to propext, Classical.choice and Quot.sound.
  - source: Every threshold strictly above 6934/10000 forces one-rectifiability in the plane
    lean: Besicovitch.forcesOneRectifiability_plane_of_gt
    module: Solution
    status: proved
    note: |-
      Compared declaration. The genuine admissible thresholds behind the infimum bound; stated with strict inequality because the argument yields a margin and nothing is claimed at the constant itself.
  - source: |-
      Classical lower bound (Besicovitch 1938, Dickinson 1939): the planar threshold is at least 1/2
    lean: Besicovitch.one_half_le_sigma_one_plane
    module: Solution
    status: proved
    note: |-
      Compared declaration. Proved from Besicovitch's example following Capdevila's account; the example is built from scratch in Besicovitch/Example/ since Mathlib has no rectifiability theory.
  - source: Besicovitch's graph is not countably one-rectifiable
    lean: Besicovitch.Example.not_isCountablyOneRectifiable_besicovitchSet
    module: Besicovitch.Example.LowerBound
    status: proved
    note: |-
      The purely unrectifiable ingredient, proved by the elementary jump argument rather than the projection theorem.
  - source: Besicovitch's graph has lower density at least 1/2 at every interior point
    lean: Besicovitch.Example.one_half_le_lowerOneDensity_graphMap
    module: Besicovitch.Example.LowerDensity
    status: proved
    note: Pointwise on the open base interval; the two endpoints are a null set.
  - source: 'Supporting bound: the exact six-point endpoint lies below the rational target'
    lean: Besicovitch.sStar_le_6934_div_10000
    module: Solution
    status: proved
    note: |-
      Not part of the Comparator submission. Recorded because it shows the formalized rational constant is consistent with, and close to, the sharp constant of the finite problem.
  - source: |-
      Analytic endpoint: the weighted score is at most -1/2000 for every separated pair of sibling pairs in the unit ball
    lean: Besicovitch.weightedGeometricBound_gram
    module: Besicovitch.SixPoint.GramWeightedBound
    status: proved
    note: |-
      The mathematical content that the thirty Gram certificates supply, and the only new analytic input to the six-point argument.
