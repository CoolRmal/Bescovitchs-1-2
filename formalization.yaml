      The bound sigma_1(R^2) <= 6934/10000 for Besicovitch's 1/2-problem, via
      thirty rational Gram certificates for the two-colour six-centre problem
    type: original-proof
    relationship: other
    note: >-
      Result origin declaration. The numerical bound 0.6934, the reduction of
      the six-point endpoint to thirty local Gram certificates, and the
      certificate data itself are, to the best of the literature search recorded
      under review.notes (performed 2026-09-02), first presented by this project.
      That search found no published bound below 7/10; novelty and current
      priority are asserted on that basis and could be overturned by work the
      search did not reach. The surrounding six-point framework is not original
      and is recorded below as background.
  - title: "Besicovitch's 1/2 problem and linear programming"
    authors:
      - "Camillo De Lellis"
      - "Federico Glaudo"
      - "Annalisa Massaccesi"
      - "Davide Vittone"
    id: "arXiv:2404.17536"
    type: "article"
    location: "https://arxiv.org/abs/2404.17536"
    relationship: "background"
    note: >-
      Supplies the structural framework this work builds on: the reduction of
      the density hypothesis to a finite family of optimization problems about
      disjoint balls at finitely many centres. That paper proves
      sigma_1(R^2) <= 7/10; the present development proves a strictly stronger
      bound by solving the two-colour six-centre instance of the same family.
      No statement or proof is transcribed from it.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: >-
      Besicovitch's example in higher dimensions: a purely unrectifiable set
      with large lower density
    authors:
      - "Jaume Capdevila"
    id: "arXiv:2607.05206"
    type: "article"
    location: "https://arxiv.org/abs/2607.05206"
    relationship: "other"
    note: >-
      Relationship other, explained here. The classical lower bound
      1/2 <= sigma_1 compared by this submission is Besicovitch's example, and
      its formalization follows the planar construction and estimates (E1),
      (E2) of this paper's section 2 verbatim; the measure, density and
      unrectifiability arguments are simplified where less is needed than the
