    type: "article"
    location: "https://arxiv.org/abs/2404.17536"
    relationship: "background"
    note: >-
      Supplies the structural framework this work builds on: the reduction of
      the density hypothesis to a finite family of optimization problems about
      disjoint balls at finitely many centres. That paper proves
      sigma_1(R^2) <= 7/10; the present development proves a strictly stronger
      bound by solving the two-colour six-centre instance of the same family.
      No statement or proof is transcribed from it.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: >-
      Besicovitch's example in higher dimensions: a purely unrectifiable set
