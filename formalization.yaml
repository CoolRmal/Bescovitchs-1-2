    tool_setup: |-
      The Lean 4 development was written by an agent in Claude Code against Mathlib, with the human directing scope, supplying the Gram-certificate document, and deciding to abandon the earlier route. Measured from the session transcripts: 3,326 API calls, 2,462,393 output tokens, and 47,951,563 tokens of input plus output plus cache writes, over 19 h 58 m of wall clock. The work splits at the point the Gram-certificate document arrived: an earlier attempt to certify the sharp constant through six-variable Bernstein certificates consumed 94 percent of those tokens and 75 percent of the wall clock and left no surviving line, and the delivered proof cost about 2.7 million tokens over 5 hours. The repository folder effort/ documents this and ships a script that regenerates the figures.
